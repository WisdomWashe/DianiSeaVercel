{#- Renders 1-5 stars. `rating` can be fractional (it's rounded); `label` is the
    accessible text read by screen readers, e.g. "4 out of 5 stars". -#}
{% macro stars(rating, label="") -%}
<span class="stars" role="img" aria-label="{{ label }}">{% for i in range(1, 6) %}<span class="star{{ ' on' if i <= (rating | round) else '' }}" aria-hidden="true">&#9733;</span>{% endfor %}</span>
{%- endmacro %}
